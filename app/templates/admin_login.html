<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administración | Juárez Downes Pastelería</title>
  <link rel="icon" type="image/jpeg" href="/static/img/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#fcf4e9] text-stone-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Top retro stripes -->
  <div class="fixed top-0 inset-x-0 h-2 patisserie-stripes"></div>

  <div class="w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-stone-200/80 space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-16 h-16 mx-auto rounded-full bg-[#fcf4e9] border-2 border-[#5f889a] flex items-center justify-center text-[#bd3742] shadow-xs">
        <span class="font-serif font-black text-2xl">JDP♥</span>
      </div>
      <h1 class="font-serif text-2xl sm:text-3xl font-bold text-stone-900">
        Panel de Control
      </h1>
      <p class="text-xs sm:text-sm text-stone-500">
        Gestión de productos, precios y fotos de Juárez Downes Pastelería
      </p>
    </div>

    {% if error %}
    <div class="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold text-center">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label for="password" class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1">
          Contraseña de administrador
        </label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          placeholder="Ingresá la clave de acceso" 
          class="w-full px-4 py-3 rounded-xl border border-stone-300 text-stone-900 focus:outline-none focus:ring-2 focus:ring-[#bd3742] text-sm"
          autofocus
        >
      </div>

      <button 
        type="submit" 
        class="w-full py-3.5 px-4 rounded-xl bg-[#bd3742] hover:bg-[#a32934] text-white font-bold text-sm shadow-md hover:shadow-lg transition-all active:scale-[0.98]"
      >
        Ingresar al Administrador
      </button>
    </form>

    <div class="pt-2 text-center border-t border-stone-100 flex items-center justify-between text-xs text-stone-500">
      <a href="/" class="hover:text-[#bd3742] transition-colors underline">
        ← Volver al sitio web
      </a>
      <span class="text-stone-400">Clave por defecto: <code class="bg-stone-100 px-1 py-0.5 rounded text-stone-600">facu2024</code></span>
    </div>

  </div>

</body>
</html>
